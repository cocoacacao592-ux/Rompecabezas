<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rompecabezas</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: #f1e6ff;
  color: #24152f;
}

.contenedor {
  width: min(92vw, 430px);
  padding: 22px;
  text-align: center;
  background: white;
  border-radius: 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}

h1 {
  margin-top: 0;
}

#nivel {
  padding: 10px;
  border: 2px solid #7b3fb6;
  border-radius: 10px;
  font-size: 16px;
  background: white;
  color: #24152f;
}

#tablero {
  width: min(84vw, 360px);
  aspect-ratio: 1;
  margin: 20px auto;
  display: grid;
  gap: 3px;
  padding: 4px;
  background: #24152f;
  border-radius: 14px;
}

.pieza {
  border: none;
  border-radius: 5px;
  padding: 0;
  cursor: pointer;
  background-repeat: no-repeat;
}

.vacio {
  background: #e7dcef !important;
  cursor: default;
}

button.accion {
  padding: 11px 18px;
  margin: 4px;
  border: none;
  border-radius: 12px;
  background: #7b3fb6;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#mensaje {
  min-height: 25px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>🧩 Rompecabezas</h1>

<p>Ordena las piezas para completar la imagen.</p>

<select id="nivel" onchange="cambiarNivel()">
  <option value="3">🟢 Fácil - 3×3</option>
  <option value="4">🟡 Normal - 4×4</option>
  <option value="5">🟠 Difícil - 5×5</option>
  <option value="6">🔴 Experto - 6×6</option>
</select>

<div id="tablero"></div>

<button class="accion" onclick="mezclar()">🔀 Mezclar</button>
<button class="accion" onclick="nuevoJuego()">🔄 Nuevo juego</button>

<p>Movimientos: <span id="movimientos">0</span></p>

<div id="mensaje"></div>

</div>

<script>

const tablero = document.getElementById("tablero");

const BASE = "/Rompecabezas/";

const imagenes = {
  3: BASE + "facil.jpeg",
  4: BASE + "normal.jpeg",
  5: BASE + "dificil.jpeg",
  6: BASE + "experto.jpeg"
};

let tamaño = 3;
let piezas = [];
let movimientos = 0;


/* Crear piezas */

function crearPiezas() {

  piezas = [];

  const total = tamaño * tamaño;

  for (let i = 0; i < total; i++) {
    piezas.push(i);
  }
}


/* Mostrar tablero */

function mostrarTablero() {

  tablero.innerHTML = "";

  tablero.style.gridTemplateColumns =
    `repeat(${tamaño}, 1fr)`;

  const imgUrl = imagenes[tamaño];

  piezas.forEach((pieza, posicion) => {

    const boton = document.createElement("button");

    boton.className = "pieza";

    if (pieza === tamaño * tamaño - 1) {

      boton.classList.add("vacio");

    } else {

      boton.style.backgroundImage =
        `url("${imgUrl}")`;

      boton.style.backgroundSize =
        `${tamaño * 100}% ${tamaño * 100}%`;

      const fila =
        Math.floor(pieza / tamaño);

      const columna =
        pieza % tamaño;

      const posicionImagen =
        100 / (tamaño - 1);

      boton.style.backgroundPosition =
        `${columna * posicionImagen}% ${fila * posicionImagen}%`;

      boton.onclick = () => mover(posicion);
    }

    tablero.appendChild(boton);
  });

  document.getElementById("movimientos").textContent =
    movimientos;
}


/* Mover */

function mover(posicion) {

  const vacio =
    piezas.indexOf(tamaño * tamaño - 1);

  const fila1 =
    Math.floor(posicion / tamaño);

  const columna1 =
    posicion % tamaño;

  const fila2 =
    Math.floor(vacio / tamaño);

  const columna2 =
    vacio % tamaño;

  const distancia =
    Math.abs(fila1 - fila2) +
    Math.abs(columna1 - columna2);

  if (distancia !== 1) return;

  [piezas[posicion], piezas[vacio]] =
    [piezas[vacio], piezas[posicion]];

  movimientos++;

  mostrarTablero();

  comprobarVictoria();
}


/* Mezclar */

function mezclar() {

  for (let i = 0; i < tamaño * tamaño * 20; i++) {

    const vacio =
      piezas.indexOf(tamaño * tamaño - 1);

    const opciones = [];

    const fila =
      Math.floor(vacio / tamaño);

    const columna =
      vacio % tamaño;

    if (fila > 0)
      opciones.push(vacio - tamaño);

    if (fila < tamaño - 1)
      opciones.push(vacio + tamaño);

    if (columna > 0)
      opciones.push(vacio - 1);

    if (columna < tamaño - 1)
      opciones.push(vacio + 1);

    const elegido =
      opciones[Math.floor(Math.random() * opciones.length)];

    [piezas[vacio], piezas[elegido]] =
      [piezas[elegido], piezas[vacio]];
  }

  movimientos = 0;

  document.getElementById("mensaje").textContent = "";

  mostrarTablero();
}


/* Victoria */

function comprobarVictoria() {

  if (piezas.every((pieza, posicion) =>
      pieza === posicion)) {

    document.getElementById("mensaje").textContent =
      "🎉 ¡Puzzle completado!";
  }
}


/* Cambiar nivel */

function cambiarNivel() {

  tamaño =
    Number(document.getElementById("nivel").value);

  crearPiezas();

  movimientos = 0;

  document.getElementById("mensaje").textContent = "";

  mezclar();
}


/* Nuevo juego */

function nuevoJuego() {

  crearPiezas();

  movimientos = 0;

  document.getElementById("mensaje").textContent = "";

  mezclar();
}


/* Iniciar */

crearPiezas();

mostrarTablero();

mezclar();

</script>

</body>
</html>
